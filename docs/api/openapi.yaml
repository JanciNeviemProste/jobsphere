openapi: 3.0.3
info:
  title: JobSphere API
  description: |
    JobSphere is an enterprise-grade Applicant Tracking System powered by AI.

    ## Features
    - AI-powered CV parsing with multi-stage fallback
    - Semantic candidate search with hybrid scoring (BM25 + Vector + LLM)
    - Skills assessments with auto-grading via Claude AI
    - Email sequence automation
    - Team management with role-based access control

    ## Authentication
    All authenticated endpoints require a valid session cookie from NextAuth.
  version: 1.0.0
  contact:
    name: JobSphere Support
    email: support@jobsphere.app
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000/api
    description: Development server
  - url: https://jobsphere-khaki.vercel.app/api
    description: Production server

tags:
  - name: Jobs
    description: Job posting management
  - name: Applications
    description: Job application management
  - name: Assessments
    description: Skills assessment management
  - name: Candidates
    description: Candidate search and profiles
  - name: Email Sequences
    description: Email automation
  - name: Team Management
    description: Organization team management
  - name: Upload
    description: File upload operations

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: NextAuth session cookie

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
      required:
        - error

    Job:
      type: object
      properties:
        id:
          type: string
          format: cuid
        title:
          type: string
        description:
          type: string
        city:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        salaryMin:
          type: number
          nullable: true
        salaryMax:
          type: number
          nullable: true
        remote:
          type: boolean
        hybrid:
          type: boolean
        employmentType:
          type: string
          enum: [FULL_TIME, PART_TIME, CONTRACT, INTERNSHIP]
        seniority:
          type: string
          nullable: true
          enum: [JUNIOR, MID, SENIOR, LEAD, MANAGER]
        status:
          type: string
          enum: [DRAFT, PUBLISHED, CLOSED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - description

    CreateJobRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        description:
          type: string
          minLength: 50
        city:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        salaryMin:
          type: number
          minimum: 0
          nullable: true
        salaryMax:
          type: number
          minimum: 0
          nullable: true
        remote:
          type: boolean
          default: false
        hybrid:
          type: boolean
          default: false
        employmentType:
          type: string
          enum: [FULL_TIME, PART_TIME, CONTRACT, INTERNSHIP]
        seniority:
          type: string
          nullable: true
      required:
        - title
        - description
        - employmentType

    Application:
      type: object
      properties:
        id:
          type: string
          format: cuid
        jobId:
          type: string
        candidateId:
          type: string
        status:
          type: string
          enum: [PENDING, SCREENING, PHONE_SCREEN, INTERVIEW, OFFER, HIRED, REJECTED]
        score:
          type: number
          nullable: true
        createdAt:
          type: string
          format: date-time

    Assessment:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        durationMin:
          type: number
        passingScore:
          type: number
        sections:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentSection'

    AssessmentSection:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        order:
          type: number
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'

    Question:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [MCQ, MULTI_SELECT, SHORT_TEXT, LONG_TEXT, CODE]
        text:
          type: string
        points:
          type: number
        choices:
          type: array
          items:
            type: string
          nullable: true
        correctIndexes:
          type: array
          items:
            type: number
          nullable: true

    MatchScore:
      type: object
      properties:
        jobId:
          type: string
        matchScore:
          type: number
          minimum: 0
          maximum: 100
        bm25Score:
          type: number
        vectorScore:
          type: number
        llmScore:
          type: number
        explanation:
          type: string
        job:
          $ref: '#/components/schemas/Job'

    EmailSequence:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        active:
          type: boolean
        steps:
          type: array
          items:
            $ref: '#/components/schemas/EmailSequenceStep'

    EmailSequenceStep:
      type: object
      properties:
        id:
          type: string
        subject:
          type: string
        bodyTemplate:
          type: string
        dayOffset:
          type: number
        order:
          type: number

    TeamMember:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
        name:
          type: string
          nullable: true
        role:
          type: string
          enum: [ORG_ADMIN, RECRUITER, HIRING_MANAGER, AGENCY]
        joinedAt:
          type: string
          format: date-time

paths:
  /jobs:
    get:
      summary: List all jobs
      description: Get a list of all active job postings with optional filters
      tags:
        - Jobs
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search term for job title or description
        - name: workMode
          in: query
          schema:
            type: string
            enum: [REMOTE, HYBRID, ONSITE]
          description: Work mode filter
        - name: employmentType
          in: query
          schema:
            type: string
            enum: [FULL_TIME, PART_TIME, CONTRACT, INTERNSHIP]
          description: Employment type filter
        - name: seniority
          in: query
          schema:
            type: string
            enum: [JUNIOR, MID, SENIOR, LEAD, MANAGER]
          description: Seniority level filter
      responses:
        '200':
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'

    post:
      summary: Create a new job
      description: Create a new job posting (employer only)
      tags:
        - Jobs
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '201':
          description: Job created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /jobs/{id}:
    get:
      summary: Get job details
      description: Get detailed information about a specific job
      tags:
        - Jobs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Job ID
      responses:
        '200':
          description: Job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /jobs/recommended:
    get:
      summary: Get recommended jobs
      description: Get AI-powered job recommendations based on user profile
      tags:
        - Jobs
      security:
        - sessionCookie: []
      responses:
        '200':
          description: List of recommended jobs with match scores
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    job:
                      $ref: '#/components/schemas/Job'
                    matchScore:
                      type: number
                    explanation:
                      type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /applications:
    get:
      summary: List applications
      description: Get list of applications (user's own or all for organization)
      tags:
        - Applications
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, SCREENING, PHONE_SCREEN, INTERVIEW, OFFER, HIRED, REJECTED]
          description: Filter by application status
        - name: jobId
          in: query
          schema:
            type: string
          description: Filter by job ID
      responses:
        '200':
          description: List of applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Application'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Submit application
      description: Submit a job application
      tags:
        - Applications
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobId:
                  type: string
                coverLetter:
                  type: string
                cvUrl:
                  type: string
                expectedSalary:
                  type: number
                  nullable: true
                availableFrom:
                  type: string
                  format: date
                  nullable: true
              required:
                - jobId
                - cvUrl
      responses:
        '201':
          description: Application submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  application:
                    $ref: '#/components/schemas/Application'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /assessments:
    post:
      summary: Create assessment
      description: Create a new skills assessment with sections and questions
      tags:
        - Assessments
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Assessment'
      responses:
        '201':
          description: Assessment created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  assessment:
                    $ref: '#/components/schemas/Assessment'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /assessments/{id}:
    get:
      summary: Get assessment details
      description: Get assessment with all sections and questions
      tags:
        - Assessments
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Assessment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
        '404':
          description: Assessment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /candidates/search:
    post:
      summary: Search candidates
      description: Semantic search for candidates with hybrid scoring (BM25 + Vector + LLM)
      tags:
        - Candidates
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: Search query (natural language)
                jobId:
                  type: string
                  nullable: true
                  description: Optional job ID for context
                filters:
                  type: object
                  properties:
                    skills:
                      type: array
                      items:
                        type: string
                    experienceMin:
                      type: number
                    experienceMax:
                      type: number
                limit:
                  type: number
                  default: 20
                offset:
                  type: number
                  default: 0
      responses:
        '200':
          description: Search results with match scores
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates:
                    type: array
                    items:
                      type: object
                      properties:
                        candidate:
                          type: object
                        matchScore:
                          type: number
                        bm25Score:
                          type: number
                        vectorScore:
                          type: number
                        llmScore:
                          type: number
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /candidates/{id}/match-scores:
    get:
      summary: Get candidate match scores
      description: Get match scores for candidate against all open jobs
      tags:
        - Candidates
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Candidate ID
      responses:
        '200':
          description: Match scores for all open jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  scores:
                    type: array
                    items:
                      $ref: '#/components/schemas/MatchScore'
        '404':
          description: Candidate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /email-sequences:
    get:
      summary: List email sequences
      description: Get all email sequences for organization
      tags:
        - Email Sequences
      security:
        - sessionCookie: []
      responses:
        '200':
          description: List of email sequences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmailSequence'

    post:
      summary: Create email sequence
      description: Create a new automated email sequence
      tags:
        - Email Sequences
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailSequence'
      responses:
        '201':
          description: Email sequence created
          content:
            application/json:
              schema:
                type: object
                properties:
                  sequence:
                    $ref: '#/components/schemas/EmailSequence'

  /organizations/current/members:
    get:
      summary: List team members
      description: Get all members of current organization
      tags:
        - Team Management
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Team members list
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/TeamMember'
                  currentUserRole:
                    type: string

    post:
      summary: Invite team member
      description: Invite a new member to the organization (ORG_ADMIN only)
      tags:
        - Team Management
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [ORG_ADMIN, RECRUITER, HIRING_MANAGER, AGENCY]
              required:
                - email
                - role
      responses:
        '201':
          description: Invitation sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          description: Forbidden (not ORG_ADMIN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /upload:
    post:
      summary: Upload file
      description: Upload a file (generic upload endpoint)
      tags:
        - Upload
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        '200':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
        '400':
          description: Invalid file or size limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cv/upload:
    post:
      summary: Upload and parse CV
      description: Upload a CV file with automatic parsing (multi-stage pipeline with OCR fallback)
      tags:
        - Upload
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: CV file (PDF or DOCX, max 10MB)
              required:
                - file
      responses:
        '200':
          description: CV parsed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  rawText:
                    type: string
                  parseMethod:
                    type: string
                    enum: [node_pdf, node_docx, ocr_tesseract, metadata_fallback]
                  confidence:
                    type: number
                    minimum: 0
                    maximum: 1
                  traceId:
                    type: string
                  extractedLength:
                    type: number
        '400':
          description: Invalid file or parsing error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
