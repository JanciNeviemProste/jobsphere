  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test, mobile-test, tablet-test]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "Desktop browsers: ${{ needs.test.result }}"
          echo "Mobile devices: ${{ needs.mobile-test.result }}"
          echo "Tablet devices: ${{ needs.tablet-test.result }}"

      - name: Fail if any tests failed
        if: needs.test.result == 'failure' || needs.mobile-test.result == 'failure' || needs.tablet-test.result == 'failure'
        run: exit 1
