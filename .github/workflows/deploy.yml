name: Deploy to Production

# ⚠️ DATABASE MIGRATIONS ARE NOT RUN HERE.
# This pipeline only gates on tests + typecheck and then triggers a Vercel build.
# Schema changes ship via `prisma db push` (migrations dir is a dev-only workflow),
# so the production DB must be synced MANUALLY *before* merging schema-dependent
# code to main — otherwise the new build queries columns that don't exist and 500s.
# Procedure: remediation/wave1-migration-runbook.md  (yarn db:push + backfill SQL).
# Required runtime env on Vercel: remediation/production-env-checklist.md.
# Background workers do NOT run on Vercel — deploy them separately:
# remediation/worker-deploy-runbook.md.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Workspace packages (e.g. @jobsphere/ai) emit gitignored dist/, and apps/web
      # resolves @prisma/client types from a generated client. Both MUST exist before
      # typecheck/test or every consumer fails to resolve them (QA-001) — mirrors ci.yml.
      - name: Build workspace packages
        run: npx turbo run build --filter='./packages/*'

      - name: Generate Prisma client
        run: |
          cd apps/web
          yarn db:generate

      - name: Run tests
        run: |
          cd apps/web
          yarn test:run

      - name: Type check
        run: |
          cd apps/web
          yarn typecheck

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

      - name: Notify Sentry of Release
        if: success()
        run: |
          if [ -n "${{ secrets.SENTRY_AUTH_TOKEN }}" ]; then
            curl -sL https://sentry.io/get-cli/ | sh
            sentry-cli releases new "${{ github.sha }}"
            sentry-cli releases set-commits "${{ github.sha }}" --auto
            sentry-cli releases finalize "${{ github.sha }}"
            sentry-cli releases deploys "${{ github.sha }}" new -e production
          fi
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: jobsphere

      - name: Create deployment summary
        if: success()
        run: |
          echo "## 🚀 Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date)" >> $GITHUB_STEP_SUMMARY
